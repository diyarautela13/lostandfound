<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Report a found item</title>

  <link rel="stylesheet" href="css/upload.css">
</head>

<body>

  <!-- ================= TOP NAVIGATION ================= -->

  <nav class="top-nav">
    <div class="nav-links">
      <a href="listing.html">Home</a>
      <a href="profile.html">Profile</a>
      <a href="messages.html">Messages</a>
      <button id="logoutBtn" type="button">Logout</button>
    </div>
  </nav>


  <div class="page-shell">

    <!-- ================= HEADER ================= -->

    <header class="site-header">

      <a href="index.html" class="brand">

        <img
          src="banasthali-logo.png"
          alt="Banasthali Vidyapith Logo"
          class="brand-logo"
        >

        <div class="brand-text">
          <span class="brand-eyebrow">
            BANASTHALI VIDYAPITH
          </span>

          <span class="brand-title">
            Campus Connect
          </span>
        </div>

      </a>

      <div class="portal-badge">
        <span class="badge-dot"></span>
        Campus Portal
      </div>

    </header>


    <!-- ================= UPLOAD CONTENT ================= -->

    <main class="upload-main">

      <div class="upload-heading">
        <span class="section-label">FOUND ITEM</span>

        <h1>I found something</h1>

        <p>
          Help a fellow student get their belongings back by reporting
          the item you found on campus.
        </p>
      </div>


      <form id="itemForm">

        <div class="form-group">
          <label for="category">Category</label>

          <select id="category" required>
            <option value="">Select category</option>
            <option>Bottle</option>
            <option>Keys</option>
            <option>ID card</option>
            <option>Bag</option>
            <option>Phone</option>
            <option>Other</option>
          </select>
        </div>


        <div class="form-group">
          <label for="colour">Colour</label>

          <select id="colour" required>
            <option value="">Select colour</option>
            <option>Black</option>
            <option>White</option>
            <option>Blue</option>
            <option>Red</option>
            <option>Green</option>
            <option>Other</option>
          </select>
        </div>


        <div class="form-group">
          <label for="shape">Shape</label>

          <select id="shape" required>
            <option value="">Select shape</option>
            <option>Round</option>
            <option>Rectangular</option>
            <option>Square</option>
            <option>Other</option>
          </select>
        </div>


        <div class="form-group">
          <label for="brand">Brand</label>

          <input
            id="brand"
            placeholder="Brand (optional)"
          >
        </div>


        <div class="form-group full-width">
          <label for="description">Description</label>

          <textarea
            id="description"
            placeholder="Describe the item..."
            required
          ></textarea>
        </div>


        <div class="form-group">
          <label for="foundDate">Date found</label>

          <input
            type="date"
            id="foundDate"
            required
          >
        </div>


        <div class="form-group">
          <label for="handedOverAt">Handed over at</label>

          <input
            id="handedOverAt"
            placeholder="Where did you hand it over?"
            required
          >
        </div>


        <div class="form-group full-width">
          <label for="secretDetail">Private detail</label>

          <input
            id="secretDetail"
            placeholder="Private detail only the owner would know"
            required
          >
        </div>


        <div class="form-group full-width">
          <label for="photo">Item photo</label>

          <input
            type="file"
            id="photo"
            accept="image/*"
            required
          >
        </div>


        <button
          type="submit"
          id="submitBtn"
        >
          Submit Found Item
        </button>

        <p id="message"></p>

      </form>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer class="site-footer">

      <span class="footer-year">1935</span>

      <span>•</span>

      <span>Banasthali Vidyapith</span>

      <span>•</span>

      <span class="footer-motto">
        सा विद्या या विमुक्तये
      </span>

    </footer>

  </div>


  <script type="module" src="js/upload.js"></script>

</body>
</html>
